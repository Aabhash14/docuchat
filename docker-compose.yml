services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docuchat
      POSTGRES_PASSWORD: docuchat
      POSTGRES_DB: docuchat
    ports:
      - "5433:5432"
    volumes:
      - docuchat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuchat"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  docuchat-db:
